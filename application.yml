# PythonBase 示例配置文件。
#
# 当前代码中的 app.web.load_runtime_settings() 仍然只读取 APP_ 环境变量。
# 本文件用于说明 pkg.config 配置模型和后续 application.yml 加载器的目标结构。
# 后续实现 pkg.config.loader 后，可复制为 application.yml 并按环境调整。

app:
  # FastAPI 应用标题，启动后会显示在 /docs。
  name: pythonbase

database:
  # 支持 mysql、postgresql。
  type: mysql
  host: 127.0.0.1
  port: 3306
  username: root
  # 示例值请按本机数据库实际密码修改；不要提交真实生产密码。
  password: "123456"
  database: pythonbase
  echo: false
  connect_timeout: 10
  # true 时应用启动会立即执行 SELECT 1。
  # 如果只是本地查看 /docs 且暂时没有数据库，可以在 dev profile 中设为 false。
  startup_check: true
  pool:
    size: 10
    max_overflow: 20
    timeout: 30
    recycle: 1800
    pre_ping: true

# RuntimeSettings 允许保留额外顶层配置段，业务模块可以在这里放自定义配置。
features:
  permission_cache_enabled: false
  temp_auth_enabled: true
  allowed_regions:
    - cn-east
    - cn-south

# 认证安全配置：密码登录与 JWT 签发参数。
# secret 至少 32 字节，生产环境必须通过 APP_SECURITY__TOKEN__SECRET 环境变量覆盖。
security:
  # 请求认证模式：严格切换，两种模式互不干扰。
  #   header（默认）：仅校验 X-User-Id / X-Tenant-Id 头，忽略 Authorization。
  #                   适用于后台服务互调，由网关/服务网格透传主体。
  #   jwt            ：仅校验 Authorization: Bearer <jwt>，忽略 X- 头。
  #                   适用于外部调用（CLI / 第三方 / SPA），必须配置下方 token.secret。
  auth_mode: header
  # 是否暴露 /iam/auth/{login,refresh,logout,password} 接口。
  # 与 auth_mode 互相独立：例如 auth_mode=jwt + enable_password_login=false
  # 表示只接受外部签发的 token，不暴露登录入口。
  enable_password_login: true
  password:
    algorithm: pbkdf2_sha256
    iterations: 600000
    max_failed_attempts: 5
    lock_duration_seconds: 900
  token:
    issuer: pythonbase
    secret: "change-me-to-a-32-byte-random-string-please"
    algorithm: HS256
    access_token_ttl_seconds: 3600
    refresh_token_ttl_seconds: 86400
    clock_skew_seconds: 30

# Celery 异步任务配置。
# worker 与 beat 通过 `uv run python celery_worker.py` 独立启动。
# 本地开发需要先启动 Redis，例如：docker run -d -p 6379:6379 redis:7-alpine。
celery:
  # 是否启用 Celery 与 /task-demo 演示路由。
  enabled: true
  # broker 与结果后端地址。
  broker_url: "redis://127.0.0.1:6379/0"
  result_backend: "redis://127.0.0.1:6379/1"
  # 定时调度按此时区解释。
  timezone: "Asia/Shanghai"
  enable_utc: false
  # Windows 本地开发会自动回退 solo 池；生产 Linux 建议默认 prefork。
  worker_pool: null
  worker_concurrency: null
  worker_prefetch_multiplier: 1
  task_acks_late: true
  task_reject_on_worker_lost: true
  task_track_started: true
  task_always_eager: false
  max_retries: 3
  retry_backoff: true
  retry_backoff_max: 600
  retry_jitter: true
  # 定时调度：enabled=true 时 worker 进程同时运行 beat。
  beat:
    enabled: false
    schedules:
      - task: "demo.echo"
        schedule: "0 3 * * *"
        args: ["daily-echo"]